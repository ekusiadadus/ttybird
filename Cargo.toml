[package]
name = "ttybird"
version = "0.8.4"
edition = "2024"
description = "Find your coding agents. Return to their terminals."
license = "MIT"
repository = "https://github.com/ekusiadadus/ttybird"
readme = "README.md"
keywords = ["terminal", "tmux", "ghostty", "agents", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
walkdir = "2"
toml = "0.9"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
ratatui = "0.29"
# The default mio backend in 0.28 spins forever on PTY EOF. The alternative
# backend bounds each poll; main additionally checks terminal hangup around it.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
libghostty-vt = { version = "=0.2.1", default-features = false }

[dev-dependencies]
tempfile = "3"
